name: Security Scan
# DevOps#199: Gitleaks for this PUBLIC repo.
#
# The other repos call the shared PerfAI-Inc/.github security-suite.yml, but a
# public repo cannot call a workflow that lives in a private repo (the run
# fails at startup with no jobs). So this is a copy of the shared Gitleaks job,
# pinned the same way. Keep the version and checksum in step with
#   https://github.com/PerfAI-Inc/.github/blob/main/.github/workflows/security-suite.yml
#
# The job name matches the shared one so the ruleset's required check is the
# same string: "scan / Gitleaks (secret scan)".
on:
  pull_request:
permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    name: scan / Gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      - name: Scan the working tree
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact -v

      - name: Scan this PR's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gitleaks detect --source . --config .gitleaks.toml --redact -v \
            --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}"
